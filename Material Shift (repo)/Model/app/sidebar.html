<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Material Shift · Barra lateral</title>
<style>
:root{--bg:#eef1f5;--panel:#fff;--panel2:#f7f8fa;--ink:#1f1e1d;--ink2:#4a4945;--muted:#6f6d68;--faint:#8c8a84;--line:#e3e1db;--line2:#f0eee9;--field:#faf9f7;--fline:#dcdad4;
  --dark:#141413;--darkfg:#fff;--hover:#f3f2ee;--sel:#e9e7e1;--req:#8b1a1a;--warnbg:#fff6e5;--warnfg:#7a4a00;--warnline:#f0d49a;--okfg:#1c7a4d;--head1:#0B2545;--head2:#134B7A}
:root[data-theme="dark"]{--bg:#0b121b;--panel:#16212e;--panel2:#1b2836;--ink:#e6edf5;--ink2:#c4d0de;--muted:#93a3b8;--faint:#7d8ca0;--line:#2a394b;--line2:#223142;--field:#1b2836;--fline:#33465c;
  --dark:#e6edf5;--darkfg:#0e1621;--hover:#1f2e3e;--sel:#26384b;--req:#ff8a80;--warnbg:#3a2c10;--warnfg:#f3c46b;--warnline:#5a4417;--okfg:#7ad7a0}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg);padding:10px;overflow:hidden;user-select:none}
input,select,button{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.brand{display:flex;align-items:center;gap:9px;padding:9px 12px;background:linear-gradient(90deg,var(--head1),var(--head2));color:#fff}
.brand img{width:24px;height:24px;border-radius:6px}
.brand b{font-size:14px;letter-spacing:.01em}
.brand .ver{font-size:11px;opacity:.7;font-weight:600}
.brand .scn{margin-left:auto;font-size:12px;opacity:.92;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .dirty{color:#ffd27a;font-weight:800;margin-left:4px}
.bar{display:flex;align-items:center;gap:2px;padding:4px 8px;background:var(--panel2);border-bottom:1px solid var(--line);position:relative}
.bar .menu{border:0;background:none;cursor:pointer;padding:5px 9px;border-radius:6px;color:var(--ink2)}
.bar .menu:hover,.bar .menu.open{background:var(--hover);color:var(--ink)}
.dd{position:absolute;top:84px;background:var(--panel);border:1px solid var(--fline);border-radius:10px;box-shadow:0 8px 28px #0003;padding:5px;z-index:40;min-width:270px}
.dd .it{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:7px 10px;border-radius:7px;cursor:pointer;position:relative}
.dd .it:hover{background:var(--hover)}
.dd .it.dis{opacity:.45;pointer-events:none}
.dd small{color:var(--faint);white-space:nowrap}
.dd hr{border:0;border-top:1px solid var(--line2);margin:4px 0}
.dd .rec{padding:5px 10px 5px 22px;font-size:12.5px}
.dd .rec span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;display:block}
.dd .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:700;padding:6px 10px 2px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:10px 0;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.content{flex:1;overflow:auto;padding:12px 14px}
label.l{display:block;color:var(--muted);font-size:12px;margin:12px 0 4px}
label.l:first-child{margin-top:0}
.req{color:var(--req);font-weight:700}
.reqnote{color:var(--req);font-size:11.5px;margin-top:10px}
.f{width:100%;height:34px;border:1px solid var(--fline);border-radius:8px;background:var(--field);padding:0 10px;user-select:text}
.f:focus{outline:2px solid #1f6feb33;border-color:var(--faint)}
.f.bad{border-color:#d9534f}
.row{display:flex;gap:8px;align-items:center}
.btn{height:34px;border:1px solid var(--fline);border-radius:8px;background:var(--panel);padding:0 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px}
.card h4{margin:0;font-size:13px;font-weight:600}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted);font-size:12.5px;margin-top:6px;user-select:text}
.seg{display:flex;border:1px solid var(--fline);border-radius:8px;overflow:hidden;margin-top:8px}
.seg button{flex:1;border:0;background:var(--field);padding:8px 0;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--fline)}
.seg button.on{background:var(--dark);color:var(--darkfg);font-weight:600}
.tcols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tcol{border:1px solid var(--line);border-radius:8px;padding:10px}
.tcol.active{border-color:var(--ink)}
.tcol h5{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);font-weight:700}
.tcol.active h5{color:var(--ink)}
.tfr{display:flex;flex-direction:column;gap:3px;margin-top:8px}
.tfr:first-of-type{margin-top:0}
.tfr span{font-size:11px;color:var(--faint)}
.tfr .f{height:30px;text-align:right;width:100%;color:var(--ink)}
.tfr .row .f:first-child{flex:1;min-width:0}
.circpills{display:flex;gap:6px;margin-bottom:10px}
.circpills button{flex:1;height:34px;border:1px solid var(--fline);border-radius:8px;background:var(--panel);color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
.circpills button:hover{background:var(--hover)}
.circpills button.on{background:var(--dark);color:var(--darkfg);border-color:var(--dark)}
.cdot{width:7px;height:7px;border-radius:50%;display:inline-block}
.cdot.desmonte{background:#475569}.cdot.mineral{background:#c47a2c}
.chip{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:999px;display:inline-block;vertical-align:middle}
.chip.mineral{background:#faf0e2;color:#a6631a}
.chip.desmonte{background:#eceff3;color:#475569}
.circuit{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-top:8px}
.circuit .chd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.circuit .names{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.pcols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pcol{border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0}
.pcol .ph{background:var(--panel2);border-bottom:1px solid var(--line);padding:6px 9px;font-weight:700;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.pcol .ph small{color:var(--faint);font-weight:600}
.plist{padding:5px;min-height:60px;max-height:330px;overflow:auto}
.pi{display:flex;align-items:center;gap:6px;padding:5px 6px;margin-bottom:4px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:grab;font-size:12.5px;touch-action:none}
.pi:hover{border-color:var(--faint)}
.pi.sel{border-color:var(--ink);background:var(--sel)}
.pi.off span.nm{color:var(--faint);text-decoration:line-through}
.pi .num{color:var(--faint);font-variant-numeric:tabular-nums;min-width:16px;font-size:11.5px}
.pi span.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi .hdl{color:var(--faint);font-size:13px;line-height:1}
.pi input{accent-color:var(--ink);margin:0;cursor:pointer}
.pi.ghost{opacity:.35}
.drag{position:fixed;pointer-events:none;z-index:80;box-shadow:0 8px 20px #0003;cursor:grabbing;opacity:.95}
.kpirow{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel2)}
.kpirow.one{grid-template-columns:1fr}
.kpicard{text-align:left;border:1.5px solid var(--fline);border-radius:10px;background:var(--panel);padding:8px 10px;cursor:pointer}
.kpicard:hover{border-color:var(--faint)}
.kpicard.on{border-color:var(--ink)}
.kpitop{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.kpilabel{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.kpicard.on .kpilabel{color:var(--ink)}
.kpival{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.kpival small{font-size:10.5px;font-weight:600;color:var(--faint);margin-left:3px}
.kpisub{font-size:10.5px;color:var(--faint);margin-top:2px}
.kpisub .ok{color:var(--okfg);font-weight:700}.kpisub .bad{color:#c0392b;font-weight:700}
.notice{margin:8px 12px 0;border:1px solid var(--warnline);background:var(--warnbg);color:var(--warnfg);border-radius:9px;padding:8px 10px;font-size:12.5px}
.notice .acts{display:flex;gap:6px;margin-top:6px;justify-content:flex-end}
.notice .btn{height:28px;font-size:12px;background:var(--panel);color:var(--ink)}
.notice .btn.go{background:var(--dark);color:var(--darkfg);border-color:var(--dark)}
.status{padding:7px 14px;font-size:12px;color:var(--muted);min-height:32px;border-top:1px solid var(--line2);user-select:text;display:flex;gap:8px;align-items:flex-start}
.spin{width:13px;height:13px;border:2px solid var(--fline);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite;flex:0 0 auto;margin-top:2px}
@keyframes sp{to{transform:rotate(360deg)}}
.foot{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--line);background:var(--panel2)}
.primary{flex:1.6;height:40px;border:0;border-radius:9px;background:var(--dark);color:var(--darkfg);font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.secondary{flex:1;height:40px;border:1px solid var(--fline);border-radius:9px;background:var(--panel);font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.primary small,.secondary small{font-size:10px;font-weight:500;opacity:.65}
button:disabled{opacity:.45;cursor:default}
.ov{position:absolute;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:60;padding:14px}
.md{background:var(--panel);border-radius:12px;padding:16px;width:100%;max-height:100%;display:flex;flex-direction:column;box-shadow:0 10px 40px #0004}
.md h3{margin:0 0 4px;font-size:15px}
.md .lst{overflow:auto;margin:10px 0;border:1px solid var(--line2);border-radius:8px;padding:4px}
.md .acts{display:flex;justify-content:flex-end;gap:8px}
.md ul{margin:8px 0;padding-left:18px;color:var(--ink2)}
.md li{margin-bottom:4px}
.md .search{width:100%;border:1px solid var(--fline);border-radius:8px;background:var(--field);padding:7px 10px;margin:8px 0 2px}
.md table{border-collapse:collapse;width:100%;font-size:12.5px}
.md td{padding:4px 6px;border-bottom:1px solid var(--line2)}
.md td:first-child{white-space:nowrap}
kbd{border:1px solid var(--fline);border-bottom-width:2px;border-radius:4px;padding:0 5px;font:11px Consolas,monospace;background:var(--panel2)}
.grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:700;margin:12px 4px 4px}
.grp:first-child{margin-top:4px}
.drow{border-bottom:1px solid var(--line2)}
.drow:last-child{border-bottom:0}
.drow-head{display:flex;align-items:center;gap:8px;padding:8px 4px;cursor:pointer}
.drow-head:hover{background:var(--hover)}
.dchevron{width:8px;height:8px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:rotate(-45deg);flex-shrink:0;transition:transform .15s;margin-left:2px}
.drow.open .dchevron{transform:rotate(45deg)}
.dname{flex:1;font-size:12.5px;font-weight:500;min-width:0;overflow-wrap:break-word}
.dsummary{font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;flex-shrink:0;white-space:nowrap}
.dsummary.st-receptor{background:#e7edf5;color:#1b3a5c}
.dsummary.st-donante{background:#e5f4ec;color:#1c7a4d}
.dsummary.st-na{background:#eef0f3;color:#8c8a84}
.drow-body{display:none;padding:2px 4px 12px 18px}
.drow.open .drow-body{display:block}
.dfield{margin-bottom:9px}
.dfield-label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:700;margin-bottom:5px}
.seg3{display:flex;border:1px solid var(--fline);border-radius:999px;padding:2px;background:var(--field)}
.seg3 button{flex:1;border:0;background:none;font-size:11px;font-weight:700;padding:6px 4px;border-radius:999px;color:var(--faint);cursor:pointer;white-space:nowrap}
.seg3 button.on-receptor{background:#e7edf5;color:#1b3a5c}
.seg3 button.on-donante{background:#e5f4ec;color:#1c7a4d}
.seg3 button.on-na{background:#eef0f3;color:#8c8a84}
.seg3 button.on-mineral{background:#faf0e2;color:#a6631a}
.seg3 button.on-desmonte{background:#eceff3;color:#475569}
.restr{font-size:12px;margin-top:6px}
.restr div{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed var(--line2)}
.restr b{font-weight:600}
.restr span{color:var(--muted);text-align:right}
.hint{font-size:11.5px;color:var(--muted);margin-top:6px}
</style></head>
<body>
<div id="app">
  <div class="brand"><img id="logo" alt=""><b>Material Shift</b><span class="ver" id="ver">v2.0</span><span class="scn" id="scn"></span></div>
  <div class="bar" id="bar">
    <button class="menu" data-menu="archivo">Archivo</button>
    <button class="menu" data-menu="exportar">Exportar</button>
    <button class="menu" data-menu="ver">Ver</button>
    <button class="menu" data-menu="ayuda">Ayuda</button>
  </div>
  <div id="dd" class="dd" style="display:none"></div>
  <div id="kpirow"></div>
  <div class="tabs" id="tabs"></div>
  <div class="content" id="content"></div>
  <div id="notice"></div>
  <div class="status" id="status"></div>
  <div class="foot">
    <button class="primary" id="calc" title="Calcular ambos circuitos (F5)"><span>Calcular</span><small>F5</small></button>
    <button class="secondary" id="excel" title="Generar y abrir el Excel del Plan Modificado (Ctrl+E)"><span>Excel</span><small>Ctrl+E</small></button>
  </div>
  <div id="modal"></div>
</div>

document.getElementById('logo').src = LOGO;
const TABS = [['inputs','Inputs'],['objetivos','Objetivos'],['prioridad','Prioridad'],['material','Material']];
let S = null, tab = 'inputs', sel = {};
let busyT0 = 0, busyTimer = null;

window.chrome.webview.addEventListener('message', e => {
  const m = JSON.parse(e.data);
  if (m.type === 'state') { S = m; document.documentElement.dataset.theme = S.dark ? 'dark' : 'light'; render(); }
  else if (m.type === 'status' && S) { Object.assign(S, {status: m.status, calcEnabled: m.calcEnabled, excelEnabled: m.excelEnabled, busy: m.busy}); renderFoot(); }
  else if (m.type === 'circuit' && S) { S.circuit = m.circuit; renderKpi(); renderContent(); }
  else if (m.type === 'notice' && S) { S.notice = m.notice; renderNotice(); }
});

const n2 = v => (Math.round(Number(v) * 100) / 100).toFixed(2);
const n3 = v => (Math.round(Number(v) * 1000) / 1000).toFixed(3);
const mineralOn = () => S && S.mineralDisponible && (S.mineralChancadoras || []).length > 0;
const circ = () => (S && S.circuit === 'mineral' && mineralOn()) ? 'mineral' : 'desmonte';
const K = (c, base) => c === 'mineral' ? 'mineral' + base.charAt(0).toUpperCase() + base.slice(1) : base;

function render() { renderBar(); renderKpi(); renderTabs(); renderContent(); renderNotice(); renderFoot(); }
function renderBar() {
  document.getElementById('scn').innerHTML = S ? esc(S.scenario || 'Sin título') + (S.dirty ? '<span class="dirty" title="Cambios sin guardar">•</span>' : '') : '';
  document.getElementById('ver').textContent = S && S.version ? S.version : 'v2.0';
}

// ------------------------------------------------------------------ menus
const dd = document.getElementById('dd');
let openMenu = null;
function menuHtml(name) {
  const it = (act, label, key, dis) => `<div class="it${dis ? ' dis' : ''}" data-act="${act}"><span>${label}</span><small>${key || ''}</small></div>`;
  if (name === 'archivo') {
    const rec = (S && S.recent) || [];
    return it('sc:new', 'Nuevo escenario', 'Ctrl+N') + it('sc:open', 'Abrir escenario…', 'Ctrl+O') +
      (rec.length ? '<div class="lbl">Abrir existente</div>' + rec.slice(0, 8).map((r, i) => `<div class="it rec" data-act="rec:${i}" title="${esc(r.path)}"><span>${esc(r.name)}</span><small>${esc(r.folder || '')}</small></div>`).join('') : '') +
      '<hr>' + it('sc:save', 'Guardar escenario', 'Ctrl+S') + it('sc:saveas', 'Guardar escenario como…', 'Ctrl+Shift+S') +
      '<hr>' + it('openScenarioFolder', 'Abrir carpeta de escenarios') + it('sc:exit', 'Salir', 'Alt+F4');
  }
  if (name === 'exportar') {
    const has = S && S.hasResults;
    return it('excel', 'Excel · Plan Modificado', 'Ctrl+E', !(S && S.excelEnabled)) + it('excelFull', 'Excel · Reporte completo (con validaciones)', '', !has) +
      it('pptAll', 'PowerPoint · Gráficos de la vista actual', 'Ctrl+Shift+E', !has) + '<hr>' +
      it('openDashboardHtml', 'Abrir dashboard en el navegador (para compartir)', '', !has) + it('openOutputFolder', 'Abrir carpeta de salida');
  }
  if (name === 'ver') {
    return it('theme', S && S.dark ? 'Modo claro' : 'Modo noche', 'Ctrl+Shift+M') + it('toggleCircuit', 'Cambiar circuito (Desmonte / Mineral)', 'Ctrl+Tab', !mineralOn()) +
      '<hr>' + it('dash:dashboard', 'Dashboard') + it('dash:tabla', 'Tabla') + it('dash:materiales', 'Materiales') + it('dash:comparar', 'Comparar escenarios', 'Ctrl+Shift+C');
  }
  return it('help', 'Guía rápida', 'F1') + it('keys', 'Atajos de teclado') + '<hr>' + it('about', 'Acerca de Material Shift');
}
document.getElementById('bar').addEventListener('click', e => {
  const b = e.target.closest('[data-menu]'); if (!b) return;
  e.stopPropagation();
  if (openMenu === b.dataset.menu) { closeMenu(); return; }
  closeMenu(); openMenu = b.dataset.menu; b.classList.add('open');
  dd.innerHTML = menuHtml(openMenu);
  dd.style.left = (b.offsetLeft) + 'px'; dd.style.display = 'block';
});
document.addEventListener('click', e => { if (!e.target.closest('#dd')) closeMenu(); });
function closeMenu() { dd.style.display = 'none'; openMenu = null; document.querySelectorAll('.menu.open').forEach(x => x.classList.remove('open')); }
dd.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act; closeMenu(); doAction(a);
});
function doAction(a) {
  if (a.startsWith('sc:')) post({type: 'scenario', op: a.slice(3)});
  else if (a.startsWith('rec:')) post({type: 'scenario', op: 'recent', path: S.recent[Number(a.slice(4))].path});
  else if (a.startsWith('dash:')) post({type: 'dashView', view: a.slice(5)});
  else if (a === 'help') showHelp();
  else if (a === 'keys') showKeys();
  else if (a === 'about') showAbout();
  else if (a === 'toggleCircuit') setCircuit(circ() === 'mineral' ? 'desmonte' : 'mineral');
  else post({type: a});
}

// ------------------------------------------------------------------ KPI cards (circuit switch)
function annualTons(sm) { const t = sm && sm.target_por_chancadora; if (!t) return null; return Object.values(t).reduce((a, b) => a + Number(b), 0) * 52; }
function fmtTons(n) { return n == null ? '—' : (n / 1e6).toLocaleString('es-PE', {minimumFractionDigits: 1, maximumFractionDigits: 1}) + 'M'; }
function kpiCard(c, label, sm) {
  const ok = sm ? (sm.destinos_ok && sm.balance_material_ok !== false && sm.matriz_ok !== false) : null;
  return `<button class="kpicard${circ() === c ? ' on' : ''}" data-circ="${c}" title="Ver y editar el circuito ${label}">` +
    `<div class="kpitop"><span class="cdot ${c}"></span><span class="kpilabel">${label}</span></div>` +
    `<div class="kpival">${fmtTons(annualTons(sm))}<small>t/año obj.</small></div>` +
    `<div class="kpisub">${sm ? Number(sm.movimientos).toLocaleString('en-US') + ' movimientos · ' + (ok ? '<span class="ok">✓ Ok</span>' : '<span class="bad">! Revisar</span>') : 'Sin calcular'}</div></button>`;
}
function renderKpi() {
  const el = document.getElementById('kpirow');
  if (!S || !S.desmonteSummary) { el.innerHTML = ''; return; }
  const hm = !!S.mineralSummary;
  el.innerHTML = `<div class="kpirow${hm ? '' : ' one'}">` + kpiCard('desmonte', 'Desmonte', S.desmonteSummary) + (hm ? kpiCard('mineral', 'Mineral', S.mineralSummary) : '') + '</div>';
}
document.getElementById('kpirow').addEventListener('click', e => { const b = e.target.closest('[data-circ]'); if (b) setCircuit(b.dataset.circ); });
function setCircuit(c) { if (!S) return; if (c === 'mineral' && !mineralOn()) return; S.circuit = c; post({type: 'circuit', circuit: c}); renderKpi(); renderContent(); }

function renderTabs() { document.getElementById('tabs').innerHTML = TABS.map(t => `<button data-tab="${t[0]}" class="${tab === t[0] ? 'on' : ''}">${t[1]}</button>`).join(''); }
document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b) return; tab = b.dataset.tab; renderTabs(); renderContent(); });

function renderNotice() {
  const el = document.getElementById('notice');
  const n = S && S.notice;
  if (!n) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="notice"><b>Nuevo escenario disponible.</b> ${esc(n.text || '')} ¿Desea actualizar?<div class="acts"><button class="btn" data-notice="dismiss">Ignorar</button><button class="btn go" data-notice="reload">Actualizar</button></div></div>`;
}
document.getElementById('notice').addEventListener('click', e => { const b = e.target.closest('[data-notice]'); if (b) { post({type: 'notice', op: b.dataset.notice}); S.notice = null; renderNotice(); } });

function renderFoot() {

// ------------------------------------------------------------------ content
function renderContent() {
  const el = document.getElementById('content');

  const keep = el.scrollTop;
  const fe = document.activeElement && el.contains(document.activeElement) ? document.activeElement.dataset.f : null;
  el.innerHTML = ({inputs: tInputs, objetivos: tObjetivos, prioridad: tPrioridad, material: tMaterial})[tab]();
  el.scrollTop = keep;
  // Long paths: show the end (the file name), not "C:\Users\...".
  el.querySelectorAll('input[data-f="input"],input[data-f="output"]').forEach(i => { if (i !== document.activeElement) i.scrollLeft = i.scrollWidth; });
  if (fe) { const f = el.querySelector(`[data-f="${fe}"]`); if (f) f.focus(); }
}
function circPills() {

}
function circuitCard(label, cls, chs, dons) {
  return `<div class="circuit"><div class="chd"><span class="chip ${cls}">${label}</span><span class="muted" style="margin:0">${chs.length + dons.length} destinos</span></div>` +
    `<div class="names"><b>Receptores:</b> ${chs.length ? esc(chs.join(', ')) : '&mdash;'}<br><b>Donantes:</b> ${dons.length ? esc(dons.join(', ')) : '&mdash;'}</div></div>`;
}

    <div class="card"><div class="between"><h4>Columnas detectadas</h4><button class="btn sm" data-act="editDonors" ${S.detecting ? 'disabled' : ''}>Editar</button></div>
      ${S.detecting ? '<div class="muted"><span class="spin" style="display:inline-block;vertical-align:-2px;margin-right:6px"></span>Leyendo el Excel…</div>' : ''}
      ${circuitCard('Desmonte', 'desmonte', S.chancadoras || [], S.donantes || [])}
      ${mineralOn() ? circuitCard('Mineral', 'mineral', S.mineralChancadoras, S.mineralDonantes) : ''}
      <div class="muted" style="margin-top:8px">Fases (${(S.phasesC1 || []).length}): ${esc((S.phasesC1 || []).map(p => p.id.replace('PHASE ', '')).join(', '))}</div>
      ${S.configSheetUsed ? '' : '<div class="muted" style="margin-top:4px">Sin hoja “Config” en el Excel · detección por nombre (solo Desmonte). Usa Editar para activar Mineral.</div>'}
    </div>
    <div class="card"><div class="between"><h4>Año activo</h4><input class="f" style="width:96px;text-align:center" data-f="activeYear" value="${esc(S.activeYear)}"></div></div>
    <div class="reqnote"><span class="req">*</span> Requerido: sin estos datos el cálculo no se ejecuta.</div>`;
}
function seg(field, opts, cur) {
  return '<div class="seg">' + opts.map(o => `<button data-set="${field}:${o[0]}" class="${cur === o[0] ? 'on' : ''}">${o[1]}</button>`).join('') + '</div>';
}
function tObjetivos() {
  const c = circ(), lbl = c === 'mineral' ? 'Mineral' : 'Desmonte';
  const g = k => S[K(c, k)];
  const dia = g('granularity') === 'diario';
  const nch = (c === 'mineral' ? S.mineralChancadoras : S.chancadoras || []).length;
  const unit = g('toleranceUnit') || 'Mt';
  const anual = Number(g('target')) * Math.max(1, nch) * 52;
  return circPills() +
    `<div class="card" style="margin-top:0"><h4>Modo · ${lbl}</h4>` + seg(K(c, 'mode'), [['objetivo_fijo', 'Objetivo fijo'], ['balanceado', 'Balanceado']], g('mode')) +
    `<div class="hint">${g('mode') === 'balanceado' ? (nch === 2 ? 'Además del objetivo, nivela el reparto entre las dos chancadoras cada semana.' : 'Con ' + nch + ' chancadora(s), Balanceado funciona igual que Objetivo fijo.') : 'Cada chancadora apunta al objetivo semanal.'}</div></div>` +
    `<div class="card"><h4>Objetivo y tolerancia · ${lbl}</h4>` + seg(K(c, 'granularity'), [['semanal', 'Semanal'], ['diario', 'Diario']], g('granularity')) +
    `<div class="hint">La pastilla decide qué corre el cálculo. Diario es independiente del semanal: se usan los dos a la vez.</div>
    <div class="tcols">
      <div class="tcol${dia ? '' : ' active'}"><h5>Semanal</h5>
        <div class="tfr"><span>Objetivo Mt/sem por chancadora</span><input class="f" data-f="${K(c, 'target')}" value="${n2(g('target'))}"></div>
        <div class="tfr"><span>Tolerancia</span><span class="row"><input class="f" data-f="${K(c, 'tolerance')}" value="${n2(g('tolerance'))}">
          <select class="f" style="width:58px;flex-shrink:0;padding:0 4px" data-f="${K(c, 'toleranceUnit')}"><option${unit === 'Mt' ? ' selected' : ''}>Mt</option><option${unit === '%' ? ' selected' : ''}>%</option></select></span></div>
      </div>
      <div class="tcol${dia ? ' active' : ''}"><h5>Diario</h5>
        <div class="tfr"><span>Objetivo Mt/día</span><input class="f" data-f="${K(c, 'dailyTarget')}" value="${n3(g('dailyTarget'))}"></div>
        <div class="tfr"><span>Tolerancia Mt</span><input class="f" data-f="${K(c, 'dailyTolerance')}" value="${n3(g('dailyTolerance'))}"></div>
      </div>
    </div>
    <div class="hint">≈ ${(anual).toLocaleString('es-PE', {maximumFractionDigits: 1})} Mt/año objetivo (${nch} chancadora${nch === 1 ? '' : 's'} × 52 semanas).</div></div>`;
}

// ------------------------------------------------------------------ prioridad (drag & drop columns)
const prioState = {desmonte: {chancadora: null}, mineral: {chancadora: null}};
function prioKeys(c) {
  if (c === 'mineral') return ['donorsMineral', 'phasesMineral'];
  const chs = S.chancadoras || [];
  const idx = Math.max(0, chs.indexOf(prioState.desmonte.chancadora));
  return idx === 0 ? ['donorsC1', 'phasesC1'] : ['donorsC2', 'phasesC2'];
}
function pcol(num, title, key) {
  const list = S[key] || [];
  const act = list.filter(x => x.active).length;
  let n = 0;
  return `<div class="pcol"><div class="ph"><span>${num}. ${title}</span><small>${act}/${list.length}</small></div><div class="plist" data-plist="${key}">` +
    list.map(it => { if (it.active) n++; return `<div class="pi${it.active ? '' : ' off'}${sel[key] === it.id ? ' sel' : ''}" data-prio="${key}" data-id="${esc(it.id)}" title="Arrastra para cambiar la prioridad · Alt+↑/↓ con la fila seleccionada"><span class="num">${it.active ? n + '.' : '–'}</span><input type="checkbox" data-tog="${key}" data-id="${esc(it.id)}"${it.active ? ' checked' : ''}><span class="nm">${esc(it.id)}</span><span class="hdl">≡</span></div>`; }).join('') +
    '</div></div>';
}
function tPrioridad() {
  const c = circ();
  const chs = c === 'mineral' ? (S.mineralChancadoras || []) : (S.chancadoras || []);
  if (!chs.length) return circPills() + '<div class="card" style="margin-top:0">No hay chancadoras configuradas para este circuito.</div>';
  const st = prioState[c];
  if (!chs.includes(st.chancadora)) st.chancadora = chs[0];
  const [dk, pk] = prioKeys(c);
  let head;
  if (c === 'desmonte' && chs.length > 1) {
    const other = chs.find(x => x !== st.chancadora);
    head = `<div class="row" style="margin-bottom:10px"><select class="f" data-prio-sel="1">${chs.map(n => `<option ${n === st.chancadora ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>` +
      `<button class="btn" data-prio-copy="${esc(other)}" title="Copia este orden de donantes y fases a ${esc(other)}">Copiar a ${esc(other)}</button></div>`;
  } else {
    head = `<div class="muted" style="margin:0 0 10px">${c === 'mineral' ? 'El orden aplica a ' + (chs.length === 1 ? esc(chs[0]) : 'todas las chancadoras de Mineral') + '.' : esc(chs[0])}</div>`;
  }
  return circPills() + `<div class="between" style="margin-bottom:8px"><div class="muted" style="margin:0">Orden de prioridad${c === 'desmonte' && chs.length > 1 ? ' por chancadora' : ''}. Arrastra las filas; desmarca para no usar.</div><button class="btn sm" data-prio-reset="1" title="Vuelve al orden detectado en el Excel, todo marcado">Restablecer</button></div>` +
    head + `<div class="pcols">${pcol(1, 'Donantes', dk)}${pcol(2, 'Fases', pk)}</div>`;
}

// ------------------------------------------------------------------ material
function tMaterial() {
  const c = circ();
  const chs = (c === 'mineral' ? S.mineralChancadoras : S.chancadoras) || [];
  const dons = (c === 'mineral' ? S.mineralDonantes : S.donantes) || [];
  const mats = (c === 'mineral' ? S.mineralMateriales : S.materiales) || [];
  const dests = chs.concat(dons);
  const bl = S.blocked || {};
  let free = 0;
  const rows = dests.map(d => { const b = (bl[d] || []).filter(m => mats.includes(m)); if (!b.length) { free++; return ''; } return `<div><b>${esc(d)}</b><span>${b.length === mats.length ? 'no recibe ni entrega material' : 'sin ' + esc(b.join(', '))}</span></div>`; }).join('');
  return circPills() + `<div class="muted" style="margin:0 0 8px">Qué materiales puede recibir y entregar cada destino. La matriz se edita en una ventana aparte.</div>
    <div class="circuit"><div class="chd"><span class="chip ${c}">${c === 'mineral' ? 'Mineral' : 'Desmonte'}</span><button class="btn sm" data-matedit="${c}">Editar matriz…</button></div>
    <div class="names">${free} de ${dests.length} destinos sin restricciones · ${mats.length} tipos de material (${esc(mats.join(', '))})</div>
    ${rows ? '<div class="restr">' + rows + '</div>' : '<div class="hint">Todos los destinos pueden recibir y entregar todos los materiales.</div>'}</div>`;
}

// ------------------------------------------------------------------ events
const content = document.getElementById('content');
content.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.f) { S[t.dataset.f] = t.value; post({type: 'set', field: t.dataset.f, value: t.value}); if (/oleranceUnit|^sheet$/.test(t.dataset.f)) renderContent(); }
  else if (t.dataset.tog) {
    const it = S[t.dataset.tog].find(x => x.id === t.dataset.id); if (it) it.active = t.checked;
    post({type: 'prio', list: t.dataset.tog, op: 'toggle', id: t.dataset.id, active: t.checked}); renderContent();
  } else if (t.dataset.prioSel) { prioState.desmonte.chancadora = t.value; renderContent(); }
});
content.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset.f) e.target.blur();
});
// On document (not #content): after clicking a row the focus is on <body>.
document.addEventListener('keydown', e => {
  if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown') && tab === 'prioridad') {
    const key = Object.keys(sel).find(k => sel[k] && content.querySelector(`[data-prio="${k}"]`)); if (!key) return;
    e.preventDefault(); moveItem(key, sel[key], e.key === 'ArrowUp' ? -1 : 1);
  }
});
content.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-set],[data-matedit],[data-circ],[data-prio-reset],[data-prio-copy]');
  if (!t) return;
  if (t.dataset.act === 'editDonors') openEditor();
  else if (t.dataset.act) post({type: t.dataset.act});
  else if (t.dataset.set) { const p = t.dataset.set.split(':'); S[p[0]] = p[1]; post({type: 'set', field: p[0], value: p[1]}); renderContent(); }
  else if (t.dataset.matedit) post({type: 'openMaterialEditor', circuit: t.dataset.matedit});
  else if (t.dataset.circ) setCircuit(t.dataset.circ);
  else if (t.dataset.prioReset) { const ks = prioKeys(circ()); post({type: 'prioReset', lists: ks}); }
  else if (t.dataset.prioCopy) { const [dk, pk] = prioKeys('desmonte'); post({type: 'prioCopy', from: [dk, pk]}); }
});
function moveItem(key, id, dir) {
  const list = S[key]; const i = list.findIndex(x => x.id === id); const j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  const x = list.splice(i, 1)[0]; list.splice(j, 0, x);
  post({type: 'prioSet', list: key, items: list}); renderContent();
}
// Drag & drop with pointer events (mouse, pen and touch)
let drag = null;
content.addEventListener('pointerdown', e => {
  const row = e.target.closest('.pi'); if (!row || e.target.tagName === 'INPUT' || e.button !== 0) return;
  const key = row.dataset.prio;
  sel = {}; sel[key] = row.dataset.id;
  content.querySelectorAll('.pi.sel').forEach(x => x.classList.remove('sel')); row.classList.add('sel');
  drag = {key: key, id: row.dataset.id, row: row, x0: e.clientX, y0: e.clientY, on: false, list: row.parentElement};
  row.setPointerCapture(e.pointerId);
});
content.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.on) {
    if (Math.abs(e.clientY - drag.y0) < 4 && Math.abs(e.clientX - drag.x0) < 4) return;
    drag.on = true;
    const r = drag.row.getBoundingClientRect();
    drag.dy = drag.y0 - r.top;
    drag.ghost = drag.row.cloneNode(true); drag.ghost.classList.add('drag'); drag.ghost.style.width = r.width + 'px'; drag.ghost.style.left = r.left + 'px';
    document.body.appendChild(drag.ghost); drag.row.classList.add('ghost');
  }
  drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
  const rows = Array.from(drag.list.querySelectorAll('.pi')).filter(x => x !== drag.row);
  let before = null;
  for (const r of rows) { const b = r.getBoundingClientRect(); if (e.clientY < b.top + b.height / 2) { before = r; break; } }
  if (before) drag.list.insertBefore(drag.row, before); else drag.list.appendChild(drag.row);
  const lb = drag.list.getBoundingClientRect();
  if (e.clientY < lb.top + 18) drag.list.scrollTop -= 8; else if (e.clientY > lb.bottom - 18) drag.list.scrollTop += 8;
});
function endDrag() {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.ghost) d.ghost.remove();
  d.row.classList.remove('ghost');
  if (d.on) {
    const order = Array.from(d.list.querySelectorAll('.pi')).map(x => x.dataset.id);
    const byId = {}; S[d.key].forEach(x => { byId[x.id] = x; });
    S[d.key] = order.map(id => byId[id]);
    post({type: 'prioSet', list: d.key, items: S[d.key]});
  }
  renderContent();
}
content.addEventListener('pointerup', endDrag);
content.addEventListener('pointercancel', endDrag);

document.getElementById('calc').addEventListener('click', () => post({type: 'calc'}));
document.getElementById('excel').addEventListener('click', () => post({type: 'excel'}));
document.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'Escape') { closeMenu(); closeModal(); return; }
  if ((e.altKey || e.getModifierState('AltGraph')) && k === 'F4') { e.preventDefault(); post({type: 'close'}); return; }   // the page would swallow it
  if (e.ctrlKey && k === 'Tab') { e.preventDefault(); if (mineralOn()) setCircuit(circ() === 'mineral' ? 'desmonte' : 'mineral'); return; }
  if (k === 'F1') { e.preventDefault(); showHelp(); return; }
  if (k === 'F5' || (e.ctrlKey && /^[a-z]$/i.test(k) && 'nosemc'.includes(k.toLowerCase()))) {
    if (e.ctrlKey && !e.shiftKey && k.toLowerCase() === 'c') return;
    e.preventDefault();
    if (document.activeElement && document.activeElement.dataset && document.activeElement.dataset.f) document.activeElement.blur();
    post({type: 'key', key: k, ctrl: e.ctrlKey, shift: e.shiftKey, alt: e.altKey});
  }
});

// S.destinoConfig only holds a real 'Config' sheet's data (or the in-app edit);
// for names it doesn't mention, fall back to what is active right now so the
// editor always opens showing the TRUE current state (see v19 fix).
function effectiveDestinoConfig(name) {
  const cfg = S.destinoConfig || {};
  if (cfg[name]) return cfg[name];
  if ((S.chancadoras || []).includes(name)) return {destino: 'Receptor', material: 'Desmonte'};
  if ((S.donantes || []).includes(name)) return {destino: 'Donante', material: 'Desmonte'};
  if ((S.mineralChancadoras || []).includes(name)) return {destino: 'Receptor', material: 'Mineral'};
  if ((S.mineralDonantes || []).includes(name)) return {destino: 'Donante', material: 'Mineral'};
  return {destino: 'N/A', material: 'N/A'};
}
function openEditor() {
  if (!S) return;
  const all = Array.from(new Set([].concat(S.chancadoras || [], S.mineralChancadoras || [], S.candidatos || [])));
  const groups = [['Receptor', 'Receptores'], ['Donante', 'Donantes'], ['N/A', 'Sin marcar (N/A)']];
  const byGroup = {Receptor: [], Donante: [], 'N/A': []};
  all.forEach(name => { const c = effectiveDestinoConfig(name); (byGroup[c.destino] || byGroup['N/A']).push([name, c]); });
  const body = groups.map(g => { const rows = byGroup[g[0]]; if (!rows.length) return ''; return `<div class="grp">${g[1]} (${rows.length})</div>` + rows.map(r => editorRowHtml(r[0], r[1])).join(''); }).join('');
  modal(`<h3>Columnas detectadas</h3><div class="muted" style="margin:0">Clic en un destino para desplegarlo: marca qué es (Receptor/Donante) y a qué circuito pertenece (Mineral/Desmonte). Sin marcar queda en N/A.</div>
    <input class="search f" id="edSearch" placeholder="Buscar destino…"><div class="lst" id="edl" style="max-height:380px">${body}</div>
    <div class="acts"><button class="btn" id="mdClose">Cancelar</button><button class="btn" style="background:var(--dark);color:var(--darkfg);border-color:var(--dark)" id="edOk">Guardar</button></div>`);
  document.getElementById('edSearch').focus();
  document.getElementById('edSearch').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll('#edl .drow').forEach(row => { row.style.display = row.dataset.name.toLowerCase().indexOf(q) >= 0 ? '' : 'none'; });
    // Hide group titles left without visible rows.
    document.querySelectorAll('#edl .grp').forEach(gr => {
      let n = gr.nextElementSibling, any = false;
      while (n && !n.classList.contains('grp')) { if (n.style.display !== 'none') any = true; n = n.nextElementSibling; }
      gr.style.display = any ? '' : 'none';
    });
  });
  document.getElementById('edl').addEventListener('click', e => {
    const segBtn = e.target.closest('button[data-v]');
    if (segBtn) {
      const sg = segBtn.closest('.seg3'); const role = sg.dataset.role;
      sg.querySelectorAll('button').forEach(x => { x.className = ''; });
      segBtn.className = role === 'destino' ? (segBtn.dataset.v === 'Receptor' ? 'on-receptor' : segBtn.dataset.v === 'Donante' ? 'on-donante' : 'on-na') : (segBtn.dataset.v === 'Mineral' ? 'on-mineral' : segBtn.dataset.v === 'Desmonte' ? 'on-desmonte' : 'on-na');
      updateRowSummary(segBtn.closest('.drow')); return;
    }
    const head = e.target.closest('.drow-head'); if (head) head.closest('.drow').classList.toggle('open');
  });
  document.getElementById('edOk').onclick = () => {
    const out = {};
    document.querySelectorAll('#edl .drow').forEach(row => {
      const segs = row.querySelectorAll('.seg3');
      const db = segs[0].querySelector('button.on-receptor,button.on-donante,button.on-na');
      const mb = segs[1].querySelector('button.on-mineral,button.on-desmonte,button.on-na');
      out[row.dataset.name] = {destino: db ? db.dataset.v : 'N/A', material: mb ? mb.dataset.v : 'N/A'};
    });
    closeModal(); S.destinoConfig = out; post({type: 'destinoConfig', config: out});
  };
}
function updateRowSummary(row) {
  const segs = row.querySelectorAll('.seg3');
  const db = segs[0].querySelector('button.on-receptor,button.on-donante,button.on-na');
  const mb = segs[1].querySelector('button.on-mineral,button.on-desmonte,button.on-na');
  const d = db ? db.dataset.v : 'N/A', m = mb ? mb.dataset.v : 'N/A';
  const el = row.querySelector('.dsummary');
  el.className = 'dsummary st-' + (d === 'Receptor' ? 'receptor' : d === 'Donante' ? 'donante' : 'na');
  el.innerHTML = d === 'N/A' ? 'N/A' : SUMMARY_LABEL[d] + ' &middot; ' + (m === 'N/A' ? 'sin circuito' : m);
}

render();
post({type: 'ready'});
</script>
</body></html>
