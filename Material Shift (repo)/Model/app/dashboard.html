<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Material Shift · Dashboard</title>
<style>
:root{
  --bg:#f3f5f8;--panel:#fff;--panel2:#f8fafc;--ink:#142033;--ink2:#33465e;--muted:#66768c;--line:#dde3ea;--grid:#e9eef4;
  --head1:#0B2545;--head2:#134B7A;--accent:#173b57;--accentfg:#fff;--chip:#fbfcfe;
  --okbg:#e7f5ec;--okfg:#1d7a3e;--okline:#bfe3cc;--badbg:#fdeceb;--badfg:#b3261e;--badline:#f4c7c3;
  --warnbg:#fff6e5;--warnfg:#8a5300;--warnline:#f3d9a4;--plan:#7f7f7f;--scn:#2ca02c;--a:#1f77b4;--b:#ff7f0e;
  --pos:#e8f6ed;--posfg:#146c2e;--neg:#fdeceb;--negfg:#a4261d;--shadow:0 1px 2px rgba(20,32,51,.05);
}
:root[data-theme="dark"]{
  --bg:#0e1621;--panel:#16212e;--panel2:#1b2836;--ink:#e6edf5;--ink2:#c4d0de;--muted:#93a3b8;--line:#2a394b;--grid:#223142;
  --head1:#081a30;--head2:#0f3a60;--accent:#3d7fb6;--accentfg:#fff;--chip:#1b2836;
  --okbg:#123222;--okfg:#7ad7a0;--okline:#1f5236;--badbg:#3a1918;--badfg:#ff948a;--badline:#5e2a27;
  --warnbg:#3a2c10;--warnfg:#f3c46b;--warnline:#5a4417;--plan:#9aa4b1;--scn:#3fbf55;--a:#4da3e8;--b:#ff9a3d;
  --pos:#14301f;--posfg:#7ad7a0;--neg:#3a1918;--negfg:#ff948a;--shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;display:flex;flex-direction:column}
button,select,input{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:linear-gradient(90deg,var(--head1),var(--head2));color:#fff;flex:0 0 auto;min-height:52px}
header img{width:30px;height:30px;border-radius:7px}
header .brand{font-size:17px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
header .ver{font-size:11.5px;opacity:.7;font-weight:600;margin-left:2px}
header .meta{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.hchip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:3px 11px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px}
.hchip b{font-weight:700}
.toolbar{display:flex;align-items:center;gap:8px;padding:10px 16px 0;flex-wrap:wrap;flex:0 0 auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.tabs button:hover{border-color:var(--muted)}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accentfg)}
.circ{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.circ button{border:0;background:none;padding:7px 14px;cursor:pointer;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:7px}
.circ button+button{border-left:1px solid var(--line)}
.circ button.on{background:var(--panel2);color:var(--ink)}
.circ button:disabled{opacity:.4;cursor:default}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.Desmonte{background:#475569}.dot.Mineral{background:#c47a2c}
.banner{margin:10px 16px 0;padding:8px 12px;border-radius:8px;background:var(--warnbg);color:var(--warnfg);border:1px solid var(--warnline);display:flex;gap:8px;align-items:center;font-size:12.5px}
main{flex:1;overflow:auto;padding:10px 16px 18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.kpi{padding:9px 13px}
.kpi .top{display:flex;justify-content:space-between;gap:6px;color:var(--muted);font-size:12px}
.kpi strong{display:block;font-size:17px;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi.ok{background:var(--okbg);border-color:var(--okline)}.kpi.ok strong{color:var(--okfg)}
.kpi.bad{background:var(--badbg);border-color:var(--badline)}.kpi.bad strong{color:var(--badfg)}
.help{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--muted);color:var(--muted);font-size:10.5px;font-weight:700;cursor:help;flex:0 0 auto}
h2{font-size:14.5px;margin:0;font-weight:700}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.phead .sp{flex:1}
.sub{color:var(--muted);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:4px 11px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accentfg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chips label{border:1px solid var(--line);padding:3px 9px 3px 6px;border-radius:7px;font-size:12px;background:var(--chip);cursor:pointer;display:flex;align-items:center;gap:5px;user-select:none}
.chips label .sw{width:10px;height:10px;border-radius:2px}
.chips input{margin:0;accent-color:var(--accent)}
.grid-mat{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:12px}
.grid-cons{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,32%);gap:12px}
.minis{display:grid;gap:8px;align-content:start}
.mini{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--panel2)}
.mini span{display:block;color:var(--muted);font-size:11px}
.mini strong{font-size:14px;font-variant-numeric:tabular-nums}
.stack{display:grid;gap:12px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.chart{position:relative;width:100%;min-width:0}
.chart svg{display:block;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.14);z-index:5;white-space:nowrap;display:none}
.tip .th{font-weight:700;margin-bottom:3px}
.tip .tr{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tip .tr span:first-child{display:flex;align-items:center;gap:6px;color:var(--ink2)}
.tip .tr b{font-variant-numeric:tabular-nums;margin-left:14px}
.tip i{display:inline-block;width:12px;height:3px;border-radius:2px}
.tscroll{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:calc(100vh - 210px)}
table.dt{width:100%;border-collapse:collapse;font-size:12px}
.dt th,.dt td{border-bottom:1px solid var(--grid);padding:5px 8px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.dt th{background:var(--panel2);color:var(--ink2);position:sticky;top:0;z-index:1;font-weight:600}
.dt thead tr:nth-child(2) th{top:27px}
.dt th.l,.dt td.l{text-align:left}
.dt th.c{text-align:center}
.dt td.pos{background:var(--pos);color:var(--posfg);font-weight:600}
.dt td.neg{background:var(--neg);color:var(--negfg);font-weight:600}
.dt td.same{color:var(--muted)}
.dt tr.tot td{font-weight:700;background:var(--panel2)}
.dt td.ok{color:var(--okfg);font-weight:600}.dt td.bad{color:var(--badfg);font-weight:600}
.note{color:var(--muted);font-size:12px;margin-top:6px}
.cmpbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cmpbar .pick{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--panel)}
.cmpbar .tag{font-weight:800;font-size:11px;border-radius:5px;padding:2px 7px;color:#fff}
.tag.A{background:var(--a)}.tag.B{background:var(--b)}
.dt th .tag{display:inline-block;font-size:10px;line-height:14px;padding:0 5px;margin-right:4px;vertical-align:1px}
.dt td.dif{font-weight:700;color:var(--ink)}
.cmpbar select{border:1px solid var(--line);border-radius:7px;background:var(--panel2);padding:5px 8px;min-width:220px;max-width:340px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.empty{height:100%;display:flex;align-items:center;justify-content:center}
.empty .card{max-width:620px;text-align:center;padding:28px}
.empty img{width:96px;height:96px;border-radius:22px;box-shadow:0 10px 30px rgba(11,37,69,.25)}
.empty h1{font-size:24px;margin:14px 0 4px}
.empty p{color:var(--muted);margin:4px 0}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0 14px;text-align:left}
.steps div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel)}
.steps b{display:block;margin-bottom:2px}
.keys{color:var(--muted);font-size:12px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font:11px Consolas,monospace;background:var(--panel)}
.recent{margin-top:16px;text-align:left}
.recent .it{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-top:6px;cursor:pointer;background:var(--panel)}
.recent .it:hover{border-color:var(--muted)}
.cm{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:5px;min-width:250px;display:none}
.cm div{padding:7px 11px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:16px}
.cm div:hover{background:var(--panel2)}
.cm hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.cm small{color:var(--muted)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1f2d3d;color:#fff;padding:8px 14px;border-radius:8px;font-size:12.5px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:1100px){.grid-cons{grid-template-columns:1fr}.two{grid-template-columns:1fr}.grid-mat{grid-template-columns:1fr}.minis{grid-template-columns:repeat(4,1fr)}}
</style>
</head>

const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ------------------------------------------------------------------ messages
if (HOST) HOST.addEventListener('message', e => {
  let m; try { m = JSON.parse(e.data); } catch (_) { return; }
  if (m.type === 'init') { S.version = m.version || S.version; S.recent = m.recent || []; setTheme(m.dark); document.getElementById('ver').textContent = S.version; render(); }
  else if (m.type === 'results') { m.run.id = m.id || m.run.id; m.run.origen = 'sesion'; addRun(m.run, true); }
  else if (m.type === 'run') { m.run.id = m.id || m.run.id; m.run.origen = m.origen || 'archivo'; addRun(m.run, false); }
  else if (m.type === 'exportPpt') { const specs = Array.from(document.querySelectorAll('.chart[data-chart]')).map(c => pptSpec(c._spec)); if (specs.length) post({type: 'pptChart', save: true, spec: {charts: specs}, name: 'Material Shift - ' + S.circuit + ' - ' + S.view}); else toast('No hay gráficos en esta vista.'); }
  else if (m.type === 'runList') { S.runList = m.list || []; if (S.view === 'comparar' || !S.current) render(); }
  else if (m.type === 'circuit') { if (m.circuit && m.circuit !== S.circuit) { S.circuit = m.circuit; render(); } }
  else if (m.type === 'theme') { setTheme(m.dark); render(); }
  else if (m.type === 'stale') { S.stale = m.text || null; renderBanner(); }
  else if (m.type === 'view') { S.view = m.view; render(); }
  else if (m.type === 'toast') { toast(m.text); }
  else if (m.type === 'recent') { S.recent = m.list || []; if (!S.current) render(); }
});

function setTheme(dark) { document.documentElement.dataset.theme = dark ? 'dark' : 'light'; }

function addRun(run, makeCurrent) {
  if (!run) return;
  run.id = run.id || ('run' + Date.now());
  const prev = S.current;
  S.runs[run.id] = run;
  if (makeCurrent) {
    S.current = run.id;
    S.stale = null;
    const circs = Object.keys(run.circuitos || {});
    if (!circs.includes(S.circuit)) S.circuit = circs[0] || 'Desmonte';
    // Compare defaults: the newest run is B, the previously shown one is A.
    S.B = run.id;
    // A keeps the user's choice unless it IS this run, or points to the results file this
    // run just overwrote (same path): then A becomes the previous run of the session.
    const pathOf = id => String(id || '').replace(/^(s\d+|f)\|/, '').toLowerCase();
    const stale = S.A && String(S.A).startsWith('f|') && pathOf(S.A) === pathOf(run.id);
    if (stale) delete S.runs[S.A];
    if (!S.A || S.A === run.id || stale) S.A = prev && prev !== run.id ? prev : (S.runList.find(r => r.id !== run.id && pathOf(r.id) !== pathOf(run.id)) || {}).id || null;
  }
  render();
}

// ------------------------------------------------------------------ chart library (SVG, no dependencies)
const CHARTS = new Set();
const RO = new ResizeObserver(entries => {
  for (const en of entries) {
    const el = en.target;
    const w = Math.round(en.contentRect.width);
    if (el._w !== w && el._draw) { el._w = w; el._draw(); }
  }
});
function mountChart(el, spec) {
  el._spec = spec;
  el.dataset.chart = '1';
  el._draw = () => (spec.kind === 'line' ? drawLine : drawBar)(el, spec);
  el._w = el.clientWidth;
  el._draw();
  RO.observe(el);
}
function niceTicks(min, max, count) {
  if (!(max > min)) { max = min + 1; }
  const span = max - min;
  let step = Math.pow(10, Math.floor(Math.log10(span / count)));
  const err = count / span * step;
  if (err <= 0.15) step *= 10; else if (err <= 0.35) step *= 5; else if (err <= 0.75) step *= 2;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(Math.round(v / step) * step);
  return ticks;
}
function monotonePath(pts) {
  const n = pts.length;
  if (n === 0) return '';
  if (n < 3) return 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L');
  const dx = [], dy = [], m = [], t = [];
  for (let i = 0; i < n - 1; i++) { dx.push(pts[i + 1][0] - pts[i][0]); dy.push(pts[i + 1][1] - pts[i][1]); m.push(dy[i] / dx[i]); }
  t.push(m[0]);
  for (let i = 1; i < n - 1; i++) t.push(m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2);
  t.push(m[n - 2]);
  for (let i = 0; i < n - 1; i++) {
    if (m[i] === 0) { t[i] = 0; t[i + 1] = 0; continue; }
    const a = t[i] / m[i], b = t[i + 1] / m[i], h = a * a + b * b;
    if (h > 9) { const k = 3 / Math.sqrt(h); t[i] = k * a * m[i]; t[i + 1] = k * b * m[i]; }
  }
  let d = 'M' + pts[0][0].toFixed(1) + ',' + pts[0][1].toFixed(1);
  for (let i = 0; i < n - 1; i++) {

function drawLine(el, spec) {

  const legH = legendItems.length ? legendLayout(legendItems, W).length * 20 + 8 : 0;

      const tx = svgEl('text', {x: V(t), y: top + ph + 16, 'text-anchor': 'middle', 'font-size': 11, fill: C.muted}, svg); tx.textContent = tl[i];

function periodRows(p, per, base) {

}

function visFor(store, p) {
  const key = S.current + '|' + p.circuit;

function render() {
  renderHeader(); renderToolbar(); renderBanner(); renderMain();
}
function renderHeader() {

  const st = p && p.settings ? p.settings : null;
  const crit = st ? `${MODE[st.modo] || st.modo} · ${GRAN[st.granularidad] || st.granularidad} · ${fmt2(st.objetivo_mt)} Mt/sem ± ${fmt2(st.tolerancia_mt)}` : '';

    `<span class="hchip" title="${esc(run.archivo_base || '')}">Escenario: <b>${esc(scnName(run))}</b></span>` +
    `<span class="hchip">${esc(run.fecha || '')}</span>`;
}
function renderToolbar() {
  const el = document.getElementById('toolbar');

  el.className = 'toolbar';

document.getElementById('toolbar').addEventListener('click', e => {

  if (v) { S.view = v.dataset.view; post({type: 'dashView', view: S.view}); render(); }

function renderMain() {
  const main = document.getElementById('main');
  CHARTS.clear();
  const keep = main.scrollTop;
  const run = curRun();
  if (!run) { main.innerHTML = emptyHtml(); return; }
  if (S.view === 'comparar') { renderCompare(main); main.scrollTop = keep; return; }
  const p = payloadOf(run, S.circuit);
  if (!p) { main.innerHTML = `<div class="panel">El escenario <b>${esc(scnName(run))}</b> no tiene circuito ${esc(S.circuit)} configurado.</div>`; return; }

      <div class="phead"><h2>Material ${perM === 'diario' ? 'Diario' : 'Semanal'} por Destino Seleccionado (t)</h2>${segPer('mat')}<span class="sp"></span>

      <div class="chips">${chips(vis, 'vis')}</div>
      <div class="grid-mat"><div class="chart" id="chMat"></div><div class="minis" id="minis"></div></div>
    </div>
    <div class="panel">
      <div class="phead"><h2>Conservación ${perC === 'diario' ? 'Diaria' : 'Semanal'} y Total por Destino Seleccionado</h2>${segPer('cons')}</div>
      <div class="chips">${chips(cvis, 'cvis')}</div>
      <div class="grid-cons"><div class="chart" id="chCons"></div><div class="chart" id="chConsTot"></div></div>
    </div>
  </div>`;
  // --- material chart
  const sel = dests.filter(d => vis.has(d));
  const rows = periodRows(p, perM, false);

  const totals = rows.map(r => sumSel(r, sel));
  const tot = totals.reduce((a, b) => a + b, 0);
  const unit = perM === 'diario' ? 'Día' : 'Semana';
  document.getElementById('minis').innerHTML =
    `<div class="mini"><span>${perM === 'diario' ? 'Total Período' : 'Total 52 Sem'}</span><strong>${fmt(tot)}</strong></div>` +
    `<div class="mini"><span>Promedio ${unit}</span><strong>${fmt(tot / Math.max(1, totals.length))}</strong></div>` +
    `<div class="mini"><span>${unit} Máx</span><strong>${fmt(totals.length ? Math.max(...totals) : 0)}</strong></div>` +
    `<div class="mini"><span>${unit} Mín</span><strong>${fmt(totals.length ? Math.min(...totals) : 0)}</strong></div>`;
  let series, refs = [];
  if (S.mode === 'total') series = [{name: 'Total seleccionado', color: cssv('--accent'), values: totals}];
  else {
    series = sel.map(d => ({name: d, color: colorOf(d, dests), values: rows.map(r => r[d] || 0)}));
    sel.filter(d => p.targets[d] !== undefined).forEach(d => {
      const c = colorOf(d, dests);
      if (perM === 'semanal') {
        refs.push({y: p.targets[d] + (p.tolerances[d] || 0), color: c}, {y: p.targets[d] - (p.tolerances[d] || 0), color: c});
      } else if (runDaily) {
        const tgt = p.dailyTargetMt != null ? p.dailyTargetMt * 1e6 : p.targets[d] / 7;
        refs.push({y: tgt + p.dailyToleranceMt * 1e6, color: c, dash: '2 2', opacity: 0.9}, {y: tgt - p.dailyToleranceMt * 1e6, color: c, dash: '2 2', opacity: 0.9});
      }
    });
  }
  mountChart(document.getElementById('chMat'), Object.assign({kind: 'line', height: 300, labels: lab, series: series, refs: refs,
    title: `Material ${perM === 'diario' ? 'diario' : 'semanal'} por destino seleccionado (t)`, subtitle: name + ' · ' + p.circuit, catName: unit}, xOpts(perM)));
  // --- conservation
  const csel = dests.filter(d => cvis.has(d));
  const crows = periodRows(p, perC, false), cbase = periodRows(p, perC, true);
  const clab = crows.map(r => r[perField(perC)]);
  mountChart(document.getElementById('chCons'), Object.assign({kind: 'line', height: 270, labels: clab,
    series: [{name: 'Plan', color: cssv('--plan'), values: cbase.map(r => sumSel(r, csel))}, {name: name, color: cssv('--scn'), values: crows.map(r => sumSel(r, csel))}],
    title: `Conservación ${perC === 'diario' ? 'diaria' : 'semanal'} por destino seleccionado (t)`, subtitle: name + ' · ' + p.circuit + ' · ' + csel.join(', '), catName: perC === 'diario' ? 'Día' : 'Semana'}, xOpts(perC)));
  const ct = p.conservationTotal.filter(r => csel.includes(r.Destino));
  mountChart(document.getElementById('chConsTot'), {kind: 'bar', height: 270, hideCats: true,
    categories: [csel.length === 1 ? csel[0] : 'Destinos seleccionados'],
    series: [{name: 'Plan', color: cssv('--plan'), values: [ct.reduce((s, r) => s + (r.Base || 0), 0)]}, {name: name, color: cssv('--scn'), values: [ct.reduce((s, r) => s + (r.Modificado || 0), 0)]}],
    title: 'Conservación total por destino seleccionado (t)', subtitle: name + ' · ' + p.circuit, catName: 'Grupo'});
}

function cellCls(v, b) { const d = (v || 0) - (b || 0); return Math.abs(d) < 0.5 ? 'same' : d > 0 ? 'pos' : 'neg'; }
function wideTable(title, rows, baseRows, dests, per, note, compare) {
  const pf = perField(per);
  let h = `<div class="panel"><div class="phead"><h2>${esc(title)}</h2></div><div class="tscroll"><table class="dt" data-title="${esc(title)}"><thead><tr><th rowspan="2" class="l">${per === 'diario' ? 'Día' : 'Semana'}</th><th class="c" colspan="${dests.length}">Destino</th><th rowspan="2">Total</th></tr><tr>` +
    dests.map(d => `<th class="c">${esc(d)}</th>`).join('') + '</tr></thead><tbody>';
  const tot = {}; let tt = 0;
  rows.forEach((r, i) => {
    const b = baseRows ? baseRows[i] : null;
    const rt = dests.reduce((s, d) => s + (r[d] || 0), 0);
    const bt = b ? dests.reduce((s, d) => s + (b[d] || 0), 0) : 0;
    h += `<tr><td class="l">${per === 'diario' ? dmy(r[pf]) : r[pf]}</td>` + dests.map(d => { tot[d] = (tot[d] || 0) + (r[d] || 0); return `<td class="${compare && b ? cellCls(r[d], b[d]) : ''}">${fmt(r[d])}</td>`; }).join('') +
      `<td class="${compare && b ? cellCls(rt, bt) : ''}">${fmt(rt)}</td></tr>`;
    tt += rt;
  });
  h += `<tr class="tot"><td class="l">Total</td>` + dests.map(d => `<td>${fmt(tot[d])}</td>`).join('') + `<td>${fmt(tt)}</td></tr>`;
  return h + `</tbody></table></div><div class="note">${esc(note)}</div></div>`;
}
function renderTabla(main, run, p) {
  const daily = hasDaily(p); if (!daily) S.per.tabla = 'semanal';
  const per = S.per.tabla, name = scnName(run);
  const seg = daily ? `<span class="seg"><button data-per="tabla:semanal" class="${per === 'semanal' ? 'on' : ''}">Semanal</button><button data-per="tabla:diario" class="${per === 'diario' ? 'on' : ''}">Diario</button></span>` : '';
  const unit = per === 'diario' ? 'día' : 'semana';

    <div class="two">${wideTable('Plan por ' + unit + ' y destino', periodRows(p, per, true), null, p.destinations, per, 'Tonelaje del plan original por ' + unit + '.', false)}
    ${wideTable(name + ' por ' + unit + ' y destino', periodRows(p, per, false), periodRows(p, per, true), p.destinations, per, 'Verde: recibe más que el Plan · Rojo: recibe menos que el Plan.', true)}</div>`;
}

function renderMateriales(main, run, p) {

  const byType = types.map(t => { const rs = p.wasteDestDetail.filter(r => r.Tipo === t); return [rs.reduce((s, r) => s + (r.Base || 0), 0), rs.reduce((s, r) => s + (r.Modificado || 0), 0)]; });
  const byDest = p.destinations.map(d => { const rs = p.wasteDestDetail.filter(r => r.Destino === d); return [rs.reduce((s, r) => s + (r.Base || 0), 0), rs.reduce((s, r) => s + (r.Modificado || 0), 0)]; });
  let rows = '';
  p.wasteDestDetail.forEach(r => { rows += `<tr><td class="l">${esc(r.Destino)}</td><td class="l">${esc(r.Tipo)}</td><td>${fmt(r.Base)}</td><td>${fmt(r.Modificado)}</td><td class="${cellCls(r.Diferencia, 0)}">${sgn(r.Diferencia)}</td></tr>`; });

  const plan = cssv('--plan'), scn = cssv('--scn');

// ------------------------------------------------------------------ compare
function runLabel(r) { return (r.escenario || 'Sin título') + (r.fecha ? ' · ' + r.fecha : ''); }
function allRunMeta() {
  const seen = new Set(), list = [];
  Object.values(S.runs).forEach(r => { seen.add(r.id); list.push({id: r.id, escenario: r.escenario, fecha: r.fecha, origen: r.origen}); });
  (S.runList || []).forEach(r => { if (!seen.has(r.id)) { seen.add(r.id); list.push(r); } });
  return list;
}
function ensureRun(id) { if (id && !S.runs[id]) { post({type: 'needRun', id: id}); return false; } return !!id; }
function renderCompare(main) {
  const list = allRunMeta();
  if (!S.B) S.B = S.current;
  if (!S.A) S.A = (list.find(r => r.id !== S.B) || {}).id || null;
  const opt = sel => list.map(r => `<option value="${esc(r.id)}" ${sel === r.id ? 'selected' : ''}>${esc(runLabel(r))}${r.origen === 'archivo' ? ' (archivo)' : ''}</option>`).join('');
  const bar = `<div class="cmpbar">
    <div class="pick"><span class="tag A">A</span><select data-pick="A"><option value="">— Elegir escenario —</option>${opt(S.A)}</select></div>

    <div class="pick"><span class="tag B">B</span><select data-pick="B"><option value="">— Elegir escenario —</option>${opt(S.B)}</select></div>
    <button class="btn" data-openres="1" title="Abrir un archivo '... - Resultados.json' de otra corrida">Abrir resultado…</button>
    <span class="sub">Se listan las corridas de esta sesión y los resultados guardados en la carpeta de salida.</span></div>`;
  const okA = ensureRun(S.A), okB = ensureRun(S.B);
  if (!S.A || !S.B) { main.innerHTML = bar + '<div class="panel">Elige dos escenarios para compararlos. Cada vez que calculas, la corrida queda disponible aquí.</div>'; return; }
  if (!okA || !okB) { main.innerHTML = bar + '<div class="panel">Cargando resultados…</div>'; return; }
  const ra = S.runs[S.A], rb = S.runs[S.B];
  const pa = payloadOf(ra, S.circuit), pb = payloadOf(rb, S.circuit);
  if (!pa || !pb) { main.innerHTML = bar + `<div class="panel">${!pa ? esc(scnName(ra)) : esc(scnName(rb))} no tiene circuito ${esc(S.circuit)}.</div>`; return; }
  let nA = scnName(ra), nB = scnName(rb);
  if (nA === nB) { nA += ' (' + (ra.fecha || 'A') + ')'; nB += ' (' + (rb.fecha || 'B') + ')'; }
  // Same plan = same Excel file name + same active year (the folder may differ between PCs).
  const baseName = r => String(r.archivo_base || '').split(/[\\/]/).pop().toLowerCase();
  const samePlan = baseName(ra) === baseName(rb) && String(ra.anio_activo) === String(rb.anio_activo);
  const daily = hasDaily(pa) && hasDaily(pb); if (!daily) S.per.cmp = 'semanal';
  const per = S.per.cmp;
  const chs = Array.from(new Set([].concat(pa.chancadoras || [], pb.chancadoras || [])));
  const sa = pa.summary || {}, sb = pb.summary || {};
  const sumCh = (p, base) => periodRows(p, 'semanal', base).reduce((s, r) => s + sumSel(r, chs), 0);
  const stA = pa.settings || {}, stB = pb.settings || {};
  const num = (lab, a, b, f) => { f = f || fmt; const d = (b || 0) - (a || 0); return `<tr><td class="l">${lab}</td><td>${f(a)}</td><td>${f(b)}</td><td class="${Math.abs(d) < 1e-9 ? 'same' : 'dif'}">${Math.abs(d) < 1e-9 ? '0' : (d > 0 ? '+' : '') + f(d)}</td></tr>`; };
  const okr = (lab, a, b, na, nb) => `<tr><td class="l">${lab}</td><td class="${a ? 'ok' : 'bad'}">${a ? '✓ Ok' : '! Revisar' + (na ? ' (' + na + ')' : '')}</td><td class="${b ? 'ok' : 'bad'}">${b ? '✓ Ok' : '! Revisar' + (nb ? ' (' + nb + ')' : '')}</td><td class="same">—</td></tr>`;
  const txt = (lab, a, b) => `<tr><td class="l">${lab}</td><td>${esc(a)}</td><td>${esc(b)}</td><td class="same">${a === b ? 'Igual' : 'Distinto'}</td></tr>`;
  let kt = num('Movimientos', sa.movimientos, sb.movimientos) + num('Brechas semanales', sa.brechas, sb.brechas) + num('Brechas diarias', sa.brechas_diarias, sb.brechas_diarias) +
    okr('Destinos', sa.destinos_ok, sb.destinos_ok) + okr('Balance material', sa.balance_material_ok, sb.balance_material_ok, sa.balance_material_bad_rows, sb.balance_material_bad_rows) +
    okr('Tabla materiales', sa.matriz_ok, sb.matriz_ok, sa.matriz_violaciones, sb.matriz_violaciones) +
    chs.map(ch => num('Obj. ' + esc(ch) + ' t/sem', pa.targets[ch], pb.targets[ch])).join('') +
    num('Total chancadoras 52 sem (t)', sumCh(pa, false), sumCh(pb, false)) +
    txt('Modo', MODE[stA.modo] || stA.modo || '—', MODE[stB.modo] || stB.modo || '—') + txt('Granularidad', GRAN[stA.granularidad] || '—', GRAN[stB.granularidad] || '—') +
    num('Objetivo Mt/sem', stA.objetivo_mt, stB.objetivo_mt, fmt2) + num('Tolerancia Mt/sem', stA.tolerancia_mt, stB.tolerancia_mt, fmt2) +
    txt('Archivo base', (ra.archivo_base || '').split(/[\\/]/).pop(), (rb.archivo_base || '').split(/[\\/]/).pop());
  const seg = daily ? `<span class="seg"><button data-per="cmp:semanal" class="${per === 'semanal' ? 'on' : ''}">Semanal</button><button data-per="cmp:diario" class="${per === 'diario' ? 'on' : ''}">Diario</button></span>` : '';
  main.innerHTML = bar + `<div class="grid-cons" style="grid-template-columns:minmax(0,1fr) minmax(330px,36%)">
    <div class="panel"><div class="phead"><h2>Material ${per === 'diario' ? 'Diario' : 'Semanal'} en Chancadoras · A vs B (t)</h2>${seg}<span class="sp"></span>
      <span class="seg"><button data-cmode="total" class="${S.cmpMode === 'total' ? 'on' : ''}">Total</button><button data-cmode="individual" class="${S.cmpMode === 'individual' ? 'on' : ''}">Individual</button></span></div>
      <div class="chart" id="cmpLine"></div><div class="note">${S.cmpMode === 'individual' ? 'Línea continua: ' + esc(nA) + ' · Línea punteada: ' + esc(nB) : ''}${samePlan ? '' : ' Los escenarios usan archivos base o años distintos: el Plan no se muestra.'}</div></div>
    <div class="panel"><div class="phead"><h2>Indicadores</h2></div><div class="tscroll" style="max-height:none"><table class="dt" data-title="Comparación de indicadores"><thead><tr><th class="l">Indicador</th><th><span class="tag A">A</span> ${esc(nA)}</th><th><span class="tag B">B</span> ${esc(nB)}</th><th>B − A</th></tr></thead><tbody>${kt}</tbody></table></div></div>
  </div>
  <div class="two" style="margin-top:12px">
    <div class="panel"><div class="phead"><h2>Total por Destino · A vs B (t)</h2></div><div class="chart" id="cmpDest"></div></div>
    <div class="panel"><div class="phead"><h2>Total por Tipo de Material · A vs B (t)</h2></div><div class="chart" id="cmpType"></div></div>
  </div>
  <div class="panel" style="margin-top:12px"><div class="phead"><h2>Detalle por ${per === 'diario' ? 'Día' : 'Semana'} · Chancadoras</h2></div><div id="cmpTable"></div></div>`;
  // line chart
  const rA = periodRows(pa, per, false), rB = periodRows(pb, per, false), rP = periodRows(pa, per, true);
  const pf = perField(per);
  const idxB = new Map(rB.map(r => [r[pf], r]));
  const lab = rA.map(r => r[pf]);
  const colA = cssv('--a'), colB = cssv('--b');
  let series;
  if (S.cmpMode === 'total') {
    series = [];
    if (samePlan) series.push({name: 'Plan', color: cssv('--plan'), values: rP.map(r => sumSel(r, chs))});
    series.push({name: nA, color: colA, values: rA.map(r => sumSel(r, chs))}, {name: nB, color: colB, values: lab.map(l => idxB.has(l) ? sumSel(idxB.get(l), chs) : null)});
  } else {
    series = [];
    chs.forEach(ch => {
      series.push({name: ch + ' · ' + nA, color: colorOf(ch, pa.destinations), values: rA.map(r => r[ch] || 0)});
      series.push({name: ch + ' · ' + nB, color: colorOf(ch, pa.destinations), dash: true, values: lab.map(l => idxB.has(l) ? (idxB.get(l)[ch] || 0) : null)});
    });
  }
  mountChart(document.getElementById('cmpLine'), Object.assign({kind: 'line', height: 320, labels: lab, series: series,
    title: `Material ${per === 'diario' ? 'diario' : 'semanal'} en chancadoras: ${nA} vs ${nB} (t)`, subtitle: S.circuit, catName: per === 'diario' ? 'Día' : 'Semana'}, xOpts(per)));
  // bars by destination / type
  const dests = Array.from(new Set([].concat(pa.destinations, pb.destinations)));
  const totBy = (p, key, val, field) => { const m = {}; (p.wasteDestDetail || []).forEach(r => { m[r[key]] = (m[r[key]] || 0) + (r[field] || 0); }); return val.map(v => m[v] || 0); };
  const dser = []; if (samePlan) dser.push({name: 'Plan', color: cssv('--plan'), values: totBy(pa, 'Destino', dests, 'Base')});
  dser.push({name: nA, color: colA, values: totBy(pa, 'Destino', dests, 'Modificado')}, {name: nB, color: colB, values: totBy(pb, 'Destino', dests, 'Modificado')});
  mountChart(document.getElementById('cmpDest'), {kind: 'bar', horizontal: true, categories: dests, series: dser, title: `Total por destino: ${nA} vs ${nB} (t)`, subtitle: S.circuit, catName: 'Destino'});

  // detail table
  let tb = `<div class="tscroll" style="max-height:420px"><table class="dt" data-title="Detalle por período: ${esc(nA)} vs ${esc(nB)}"><thead><tr><th class="l">${per === 'diario' ? 'Día' : 'Semana'}</th>${samePlan ? '<th>Plan</th>' : ''}<th>${esc(nA)}</th><th>${esc(nB)}</th><th>B − A</th></tr></thead><tbody>`;
  let tA = 0, tB = 0, tP = 0;
  rA.forEach((r, i) => {
    const a = sumSel(r, chs), b = idxB.has(r[pf]) ? sumSel(idxB.get(r[pf]), chs) : 0, pl = sumSel(rP[i] || {}, chs);
    tA += a; tB += b; tP += pl;
    tb += `<tr><td class="l">${per === 'diario' ? dmy(r[pf]) : r[pf]}</td>${samePlan ? `<td>${fmt(pl)}</td>` : ''}<td>${fmt(a)}</td><td>${fmt(b)}</td><td class="${cellCls(b, a)}">${sgn(b - a)}</td></tr>`;
  });
  tb += `<tr class="tot"><td class="l">Total</td>${samePlan ? `<td>${fmt(tP)}</td>` : ''}<td>${fmt(tA)}</td><td>${fmt(tB)}</td><td>${sgn(tB - tA)}</td></tr></tbody></table></div>`;
  document.getElementById('cmpTable').innerHTML = tb;
}

// ------------------------------------------------------------------ interactions in main
const mainEl = document.getElementById('main');
mainEl.addEventListener('change', e => {
  const t = e.target;
  const run = curRun(); const p = run ? payloadOf(run, S.circuit) : null;
  if (t.dataset.vis != null || t.dataset.cvis != null) {
    const store = t.dataset.vis != null ? S.vis : S.consVis;
    const set = visFor(store, p); const d = t.dataset.vis != null ? t.dataset.vis : t.dataset.cvis;
    if (t.checked) set.add(d); else { set.delete(d); if (!set.size) set.add(d); }
    renderMain();
  } else if (t.dataset.pick) {
    S[t.dataset.pick] = t.value || null; renderMain();
  }
});
mainEl.addEventListener('dblclick', e => {
  const lab = e.target.closest('.chips label'); if (!lab) return;
  const inp = lab.querySelector('input'); const run = curRun(); const p = payloadOf(run, S.circuit);
  const store = inp.dataset.vis != null ? S.vis : S.consVis; const d = inp.dataset.vis != null ? inp.dataset.vis : inp.dataset.cvis;
  store[S.current + '|' + p.circuit] = new Set([d]); e.preventDefault(); renderMain();
});
mainEl.addEventListener('click', e => {
  const t = e.target.closest('[data-per],[data-mode],[data-cmode],[data-swap],[data-openres]');
  if (!t) return;
  if (t.dataset.per) { const q = t.dataset.per.split(':'); S.per[q[0]] = q[1]; renderMain(); }
  else if (t.dataset.mode) { S.mode = t.dataset.mode; renderMain(); }
  else if (t.dataset.cmode) { S.cmpMode = t.dataset.cmode; renderMain(); }
  else if (t.dataset.swap) { const x = S.A; S.A = S.B; S.B = x; renderMain(); }
  else if (t.dataset.openres) post({type: 'openResultFile'});
});

// ------------------------------------------------------------------ context menu & export
const cm = document.getElementById('cm');
let cmTarget = null;
document.addEventListener('contextmenu', e => {
  const chart = e.target.closest('.chart[data-chart]');
  const table = e.target.closest('table.dt');
  e.preventDefault();
  if (!chart && !table) { cm.style.display = 'none'; return; }
  document.querySelectorAll('.tip').forEach(t => { t.style.display = 'none'; });
  cmTarget = chart || table;
  const items = chart ? [
    ['data', 'Copiar datos del gráfico'], ['img', 'Copiar como imagen'], ['saveimg', 'Guardar como imagen…'],
    HOST ? ['-'] : null, HOST ? ['ppt', 'Copiar como gráfico de PowerPoint', 'editable'] : null, HOST ? ['pptsave', 'Exportar a PowerPoint (.pptx)…'] : null,
    HOST ? ['pptall', 'Exportar todos los gráficos a PowerPoint…'] : null
  ] : [['tsv', 'Copiar tabla'], ['html', 'Copiar con formato', 'Excel / Word / PPT'], ['timg', 'Copiar como imagen', 'parte visible']];
  cm.innerHTML = items.filter(Boolean).map(it => it[0] === '-' ? '<hr>' : `<div data-cm="${it[0]}"><span>${it[1]}</span>${it[2] ? '<small>' + it[2] + '</small>' : ''}</div>`).join('');
  cm.style.display = 'block';
  const w = cm.offsetWidth, h = cm.offsetHeight;
  cm.style.left = Math.min(e.clientX, innerWidth - w - 6) + 'px';
  cm.style.top = Math.min(e.clientY, innerHeight - h - 6) + 'px';
});
document.addEventListener('click', e => { if (!e.target.closest('#cm')) cm.style.display = 'none'; });
document.addEventListener('scroll', () => { cm.style.display = 'none'; }, true);
cm.addEventListener('click', async e => {
  const it = e.target.closest('[data-cm]'); if (!it) return;
  cm.style.display = 'none';
  const op = it.dataset.cm, el = cmTarget;
  try {
    if (op === 'data') { const t = chartTable(el._spec); copyRich(t.tsv, t.html, 'Datos del gráfico copiados'); }
    else if (op === 'img') { const png = await chartPng(el); copyImage(png, 'Gráfico copiado como imagen'); }
    else if (op === 'saveimg') { const png = await chartPng(el); saveImage(png, el._spec.title); }
    else if (op === 'ppt' || op === 'pptsave') post({type: 'pptChart', save: op === 'pptsave', spec: {charts: [pptSpec(el._spec)]}, name: el._spec.title});
    else if (op === 'pptall') { const specs = Array.from(document.querySelectorAll('.chart[data-chart]')).map(c => pptSpec(c._spec)); post({type: 'pptChart', save: true, spec: {charts: specs}, name: 'Material Shift - ' + S.circuit}); }
    else if (op === 'tsv' || op === 'html') { const t = tableExport(el); copyRich(t.tsv, op === 'html' ? t.html : null, 'Tabla copiada'); }
    else if (op === 'timg') {
      const box = el.closest('.tscroll') || el; const r = box.getBoundingClientRect();
      const x = Math.max(0, r.left), y = Math.max(0, r.top), w = Math.min(innerWidth, r.right) - x, h = Math.min(innerHeight, r.bottom) - y;
      if (HOST) post({type: 'captureRect', rect: {x: x, y: y, w: w, h: h, dpr: devicePixelRatio}, name: el.dataset.title || 'Tabla'});
    }
  } catch (err) { toast('No se pudo completar: ' + err.message); }
});
function chartTable(spec) {
  const cats = spec.kind === 'line' ? spec.labels.map(l => spec.tipLabel ? spec.tipLabel(l).replace(/^Semana /, '') : l) : spec.categories;
  const head = [spec.catName || ''].concat(spec.series.map(s => s.name));
  const rows = cats.map((c, i) => [c].concat(spec.series.map(s => s.values[i] == null ? '' : Math.round(s.values[i]))));
  const tsv = [head.join('\t')].concat(rows.map(r => r.join('\t'))).join('\r\n');
  const st = 'font-family:Segoe UI,Arial;font-size:9pt;border:1px solid #D6DCE2;padding:3px 8px;';
  const html = `<table style="border-collapse:collapse"><tr>${head.map(h => `<th style="${st}background:#F1F3F6;font-weight:600">${esc(h)}</th>`).join('')}</tr>` +
    rows.map(r => '<tr>' + r.map((v, j) => `<td style="${st}text-align:${j ? 'right' : 'left'}">${j && v !== '' ? fmt(v) : esc(v)}</td>`).join('') + '</tr>').join('') + '</table>';
  return {tsv: tsv, html: html};
}
function pptSpec(spec) {
  const kind = spec.kind === 'line' ? 'line' : (spec.horizontal ? 'bar' : 'column');
  const cats = spec.kind === 'line' ? spec.labels.map(l => spec.xFmt ? String(spec.tipLabel ? spec.tipLabel(l) : l).replace(/^Semana /, '') : l) : spec.categories;
  return {title: spec.title, subtitle: spec.subtitle || '', kind: kind, categories: cats,
    series: spec.series.map(s => ({name: s.name, color: s.color, dash: !!s.dash, values: s.values.map(v => v == null ? null : Math.round(v))}))};
}
function tableExport(table) {
  const rows = Array.from(table.querySelectorAll('tr'));
  const tsv = rows.map(tr => Array.from(tr.children).map(td => { const t = td.textContent.trim(); const cs = Number(td.getAttribute('colspan') || 1); return t + '\t'.repeat(cs - 1); }).join('\t')).join('\r\n');
  const st = 'font-family:Segoe UI,Arial;font-size:9pt;border:1px solid #D6DCE2;padding:3px 8px;white-space:nowrap;';
  const html = '<table style="border-collapse:collapse">' + rows.map(tr => '<tr>' + Array.from(tr.children).map(td => {
    const cs = getComputedStyle(td); const th = td.tagName === 'TH';
    const bg = th ? '#F1F3F6' : td.classList.contains('pos') ? '#E8F6ED' : td.classList.contains('neg') ? '#FDECEB' : tr.classList.contains('tot') ? '#F5F7FA' : '#FFFFFF';
    const fg = td.classList.contains('pos') ? '#146C2E' : td.classList.contains('neg') ? '#A4261D' : td.classList.contains('ok') ? '#1D7A3E' : td.classList.contains('bad') ? '#B3261E' : '#142033';
    const span = (td.getAttribute('colspan') ? ` colspan="${td.getAttribute('colspan')}"` : '') + (td.getAttribute('rowspan') ? ` rowspan="${td.getAttribute('rowspan')}"` : '');
    return `<${th ? 'th' : 'td'}${span} style="${st}background:${bg};color:${fg};text-align:${cs.textAlign};font-weight:${th || tr.classList.contains('tot') ? 600 : 400}">${esc(td.textContent.trim())}</${th ? 'th' : 'td'}>`;
  }).join('') + '</tr>').join('') + '</table>';
  return {tsv: tsv, html: html};
}
function chartPng(el, scale) {
  scale = scale || 2;
  const spec = el._spec; const svg = el.querySelector('svg');
  const W = Number(svg.getAttribute('width')), H = Number(svg.getAttribute('height'));
  const clone = svg.cloneNode(true);
  clone.querySelectorAll('[visibility="hidden"]').forEach(n => n.remove());
  const xml = new XMLSerializer().serializeToString(clone);
  const img = new Image();
  return new Promise((res, rej) => {
    img.onload = () => {
      const titleH = 46;
      const c = document.createElement('canvas'); c.width = (W + 32) * scale; c.height = (H + titleH + 16) * scale;
      const g = c.getContext('2d'); g.scale(scale, scale);
      g.fillStyle = cssv('--panel'); g.fillRect(0, 0, W + 32, H + titleH + 16);
      g.fillStyle = cssv('--ink'); g.font = '700 15px "Segoe UI"'; g.fillText(spec.title || '', 16, 24);
      g.fillStyle = cssv('--muted'); g.font = '12px "Segoe UI"'; g.fillText(spec.subtitle || '', 16, 41);
      g.drawImage(img, 16, titleH, W, H);
      res(c.toDataURL('image/png'));
    };
    img.onerror = () => rej(new Error('imagen'));
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
  });
}
function copyRich(tsv, html, msg) {
  if (HOST) { post({type: 'copy', text: tsv, html: html || null}); toast(msg); return; }
  if (html && window.ClipboardItem) navigator.clipboard.write([new ClipboardItem({'text/plain': new Blob([tsv], {type: 'text/plain'}), 'text/html': new Blob([html], {type: 'text/html'})})]).then(() => toast(msg));
  else navigator.clipboard.writeText(tsv).then(() => toast(msg));
}
function copyImage(png, msg) {
  if (HOST) { post({type: 'copyImage', png: png}); toast(msg); return; }
  fetch(png).then(r => r.blob()).then(b => navigator.clipboard.write([new ClipboardItem({'image/png': b})])).then(() => toast(msg));
}
function saveImage(png, name) {
  if (HOST) { post({type: 'saveImage', png: png, name: name}); return; }
  const a = document.createElement('a'); a.href = png; a.download = (name || 'grafico') + '.png'; a.click();
}
let toastT = null;
function toast(text) { const t = document.getElementById('toast'); t.textContent = text; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }

// ------------------------------------------------------------------ keys -> host (shortcuts work wherever the focus is)
document.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'Escape') { cm.style.display = 'none'; return; }
  if ((e.altKey || e.getModifierState('AltGraph')) && k === 'F4') { e.preventDefault(); post({type: 'close'}); return; }   // the page would swallow it
  if (e.ctrlKey && k === 'Tab') { e.preventDefault(); const run = curRun(); const have = run ? Object.keys(run.circuitos || {}) : []; const nx = S.circuit === 'Desmonte' ? 'Mineral' : 'Desmonte'; if (S.view === 'comparar' || have.includes(nx)) { S.circuit = nx; post({type: 'circuit', circuit: nx}); render(); } return; }
  if (k === 'F5' || k === 'F1' || (e.ctrlKey && /^[a-z]$/i.test(k) && 'nosemzp'.includes(k.toLowerCase()))) {
    if (e.ctrlKey && k.toLowerCase() === 'c') return;
    e.preventDefault();
    post({type: 'key', key: k, ctrl: e.ctrlKey, shift: e.shiftKey, alt: e.altKey});
  }
});

// ------------------------------------------------------------------ start
if (EMBED) {
  EMBED.id = 'embed'; EMBED.origen = 'archivo';
  S.runs.embed = EMBED; S.current = 'embed';
  S.circuit = Object.keys(EMBED.circuitos || {})[0] || 'Desmonte';
  if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) setTheme(true);
}
render();
post({type: 'dashReady'});
</script>
